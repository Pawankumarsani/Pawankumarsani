# Contribution snake — generates the animated snake that eats your contribution graph.
# WHERE IT GOES: .github/workflows/snake.yml in the repo Pawankumarsani/Pawankumarsani
#                (the special profile repo whose README.md is your profile page).
#
# It commits the SVGs to an "output" branch; the README already points at:
#   https://raw.githubusercontent.com/Pawankumarsani/Pawankumarsani/output/github-snake.svg
#   https://raw.githubusercontent.com/Pawankumarsani/Pawankumarsani/output/github-snake-dark.svg
#
# After the first successful run, no further setup is needed. Re-runs every 12 hours.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
